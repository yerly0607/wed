<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscripción</title>
    <link rel="stylesheet" href="formulario_yerli.css">
</head>
<body>
    <div class="form-container">
        <h1>Formulario de inscripción de familiares</h1>
        <p>Inscriba aquí a sus familiares</p>
        <form method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="segundo-nombre">Segundo nombre:</label>
            <input type="text" id="segundo-nombre">

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido">

            <label for="edad">Edad:</label>
            <input type="number" id="edad" required min="1" max="100">

            <label for="fecha">Fecha de nacimiento:</label>
            <input type="date" id="fecha" required>

            <label for="celular">Celular:</label>
            <input type="tel" id="celular" pattern="[0-9]{10}" required>

            <label for="foto">Foto:</label>
            <input type="file" id="foto" accept="image/*">

            <label>Sexo:</label>
            <div class="radio-group">
                <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                <label><input type="radio" name="sexo" value="femenino"> Femenino</label>
                <label><input type="radio" name="sexo" value="otro"> Otro</label>
            </div>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="relacion">Relación con usted:</label>
            <select id="relacion" name="relacion">
                <option value="padre">Padre</option>
                <option value="madre">Madre</option>
                <option value="hermano">Hermano</option>
                <option value="hermana">Hermana</option>
                <option value="otro">Otro</option>
            </select>

            <label for="intereses">Intereses:</label>
            <select id="intereses" name="intereses" multiple size="4">
                <option value="futbol">Fútbol</option>
                <option value="musica">Música</option>
                <option value="viajes">Viajes</option>
                <option value="caminar">Caminar</option>
            </select>

            <input type="submit" value="Registrar">
        </form>
    </div>
</body>
</html>
